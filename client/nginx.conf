# Serves the built React app. This container sits BEHIND Caddy (which terminates
# HTTPS and proxies /api to the API container), so nginx here only needs to:
#   1. serve static assets
#   2. fall back to index.html for client-side routes (React Router)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed asset filenames never change contents — cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Everything else: try the file, then the folder, then hand to the SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must never be cached, or users get a stale shell after a deploy.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
