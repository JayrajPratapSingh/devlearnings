name: CI

on:
  push:
    branches: [production]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Each workspace has its own lockfile and is built as its own container,
      # so install and check them independently.
      - name: server — install, typecheck, build
        working-directory: server
        run: |
          npm ci
          npx prisma generate
          npm run typecheck
          npm run build

      - name: client — install, typecheck, build
        working-directory: client
        run: |
          npm ci
          npm run build

      - name: execution-service — install, typecheck, build
        working-directory: execution-service
        run: |
          npm ci
          npm run typecheck
          npm run build
