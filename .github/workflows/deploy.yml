name: Deploy

# Push to production -> build images -> push to GHCR -> pull + restart on the server.
on:
  push:
    branches: [production]
  workflow_dispatch: {}

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [server, client]
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase owner
        id: owner
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/devprep-${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ steps.owner.outputs.value }}/devprep-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    # Stays skipped (Actions stays green) until you set the repo variable
    # DEPLOY_ENABLED = true — do that in step 6 of DEPLOYMENT.md, once the
    # server exists and the SSH secrets are added.
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Lowercase owner
        id: owner
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: SSH deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd /opt/devprep
            git pull --ff-only origin production
            OWNER="${{ steps.owner.outputs.value }}"
            SHA="${{ github.sha }}"
            export SERVER_IMAGE="ghcr.io/$OWNER/devprep-server:$SHA"
            export CLIENT_IMAGE="ghcr.io/$OWNER/devprep-client:$SHA"
            docker compose --env-file .env.production -f docker-compose.prod.yml pull
            docker compose --env-file .env.production -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
